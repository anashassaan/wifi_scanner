name: wifi_scanner
description: "A modern WiFi QR Password Scanner built with Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  mobile_scanner: ^5.1.1
  share_plus: ^10.0.0
  path_provider: ^2.1.3
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  intl: ^0.20.2
  permission_handler: ^11.3.1
  flutter_svg: ^2.0.10+1
  image_picker: ^1.1.2
  wifi_iot: ^0.3.19
  wifi_scan: ^0.4.1+2
  flutter_secure_storage: ^10.3.1
  flutter_markdown: ^0.7.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.11
  hive_generator: ^2.0.1
  freezed: 2.4.7
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/Wifi_logo.png"
  adaptive_icon_background: "#F5F5F7"
  adaptive_icon_foreground: "assets/icons/Wifi_logo.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/icons/Wifi_logo.png"
  android_12:
    image: "assets/icons/Wifi_logo.png"
    color: "#FFFFFF"
  fullscreen: true

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - PRIVACY_POLICY.md
